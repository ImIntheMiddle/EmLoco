SEED: 0
TRAIN:
    batch_size: 28 # lower this if you run out of GPU memory
    epochs: 100
    num_workers: 5
    input_track_size: 9
    output_track_size: 12
    lr: 0.0001
    lr_decay: 1
    lr_drop: true
    aux_weight: 0.2
    val_frequency: 2
    optimizer: "adam"
    max_grad_norm: 1.0
DATA:
    train_datasets:
        - jrdb_all_visual_cues
    preprocessed: true
MODEL:
    seq_len: 246 # 1*21 + (token_num-1)*9
    token_num: 26 # 1 traj + 1 2dbb + 24 SMPL joints
    num_layers_local: 6
    num_layers_global: 3
    num_heads: 4
    num_modes: 20
    dim_hidden: 128
    dim_feedforward: 1024
    type: "transmotion"
    eval_single: false
    output_scale: 1
    checkpoint: ""
    valuenet_checkpoint: "../pacer/output/exp/pacer/valuenet_realpath_JTA+JRDB_valuenet_00025000.pth"
